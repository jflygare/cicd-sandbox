# https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action

name: API Environment Settings
description: 'Get build vars based on environment'
inputs:
  environment:
    description: 'Environment name'
    required: true
outputs:
  short-name:
    description: 'Short name of environment'
    value: ${{ steps.translate.outputs.short-name }}
  aws-region:
    description: 'AWS region to use'
    value: ${{ steps.translate.outputs.aws-region }}
  aws-access-key-id:
    description: 'AWS access key id'
    value: ${{ steps.translate.outputs.aws-access-key-id }}
  aws-secret-access-key:
    description: 'AWS access key secret'
    value: ${{ steps.translate.outputs.aws-secret-access-key }}

runs:
  using: composite
  steps:
    - id: translate
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        # Keep secrets secure by only referencing as env vars in script
        # For now, all envs use same AWS keys. If this changes, consider using environment specific secrets in GitHub
        # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-environments-for-deployment
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      shell: bash
      run: |
        if [ "${ENVIRONMENT}" == "production" ]; then
          SHORT_NAME=prod
        elif [ "${ENVIRONMENT}" == "development" ]; then
          SHORT_NAME=dev
        else
          echo "Unsupported environment: ${ENVIRONMENT}" >&2
          exit 1
        fi
        echo "short-name=${SHORT_NAME}" >> $GITHUB_OUTPUT
        echo "aws-region=us-east-2" >> $GITHUB_OUTPUT
        echo "aws-access-key-id=${AWS_ACCESS_KEY_ID}" >> $GITHUB_OUTPUT
        echo "aws-secret-access-key=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_OUTPUT
